apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aqm-ingress
  namespace: aqm
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aqm-frontend
                port:
                  number: 80

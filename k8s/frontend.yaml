apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqm-frontend
  namespace: aqm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aqm-frontend
  template:
    metadata:
      labels:
        app: aqm-frontend
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: frontend
          image: 454005357524.dkr.ecr.eu-north-1.amazonaws.com/aqm-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aqm-frontend
  namespace: aqm
spec:
  selector:
    app: aqm-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

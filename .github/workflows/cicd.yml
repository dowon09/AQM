name: AQM CI/CD

on:
  push:
    branches: [main]
    paths:
      - "aqm-backend/**"
      - "aqm-frontend/**"
      - "k8s/**"
      - ".github/workflows/cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "aqm-backend/**"
      - "aqm-frontend/**"
      - "k8s/**"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqm-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 454005357524.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./aqm-backend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.ECR_REGISTRY }}/aqm-backend:${{ github.sha }}

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./aqm-frontend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.ECR_REGISTRY }}/aqm-frontend:${{ github.sha }}

  deploy:
    name: Deploy to K3s
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ env.ECR_REGISTRY }}/aqm-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.ECR_REGISTRY }}/aqm-frontend:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS=$(jq -n \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            '{
              commands: [
                "set -e",
                ("sudo kubectl set image deployment/aqm-backend *=\($backend) -n aqm"),
                ("sudo kubectl set image deployment/aqm-frontend *=\($frontend) -n aqm"),
                "sudo kubectl rollout status deployment/aqm-backend -n aqm --timeout=180s",
                "sudo kubectl rollout status deployment/aqm-frontend -n aqm --timeout=180s"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy AQM ${GITHUB_SHA}" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM."
          exit 1

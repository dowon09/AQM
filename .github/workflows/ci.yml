name: AQM CI

"on":
  push:
    branches:
      - main
    paths:
      - "aqm-backend/**"
      - "aqm-frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "aqm-backend/**"
      - "aqm-frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./aqm-backend
          platforms: linux/amd64
          push: false
          tags: aqm-backend:ci

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./aqm-frontend
          platforms: linux/amd64
          push: false
          tags: aqm-frontend:ci
